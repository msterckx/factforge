<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Game of Trivia — outro</title>
  <!--
    Fixed 5-second outro for the YouTube videos. Rendered once:
      npx hyperframes render video-assets/outro/game-of-trivia-outro --fps=30
    and appended to every final video by scripts/concat-video-segments.js.
    Silent on purpose — concat adds a matching silent track.
  -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&display=block">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a131c; }
    #stage {
      width: 1920px; height: 1080px; position: relative; overflow: hidden;
      background: radial-gradient(ellipse at 50% 42%, #16263a 0%, #0a131c 62%);
      font-family: 'Oswald', sans-serif; color: #fff;
    }
    #lockup {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 46px;
    }
    #mark {
      position: relative; width: 170px; height: 170px; background: #000;
      display: flex; align-items: center; justify-content: center;
    }
    #mark-border { position: absolute; inset: 10px; }
    #mark-border rect { fill: none; stroke: #fff; stroke-width: 6; }
    #mark-text { font-weight: 700; font-size: 70px; line-height: 1; letter-spacing: 2px; }
    #thanks-wrap { overflow: hidden; padding: 0 12px; }
    #thanks {
      font-weight: 700; font-size: 84px; line-height: 1.1; letter-spacing: 6px;
      text-transform: uppercase; white-space: nowrap;
    }
    #more { display: flex; align-items: center; gap: 28px; margin-top: -10px; }
    #more .rule { width: 110px; height: 3px; background: rgba(255,255,255,0.55); transform-origin: center; }
    #more-text {
      font-weight: 400; font-size: 46px; letter-spacing: 3px;
      color: rgba(255,255,255,0.88); white-space: nowrap;
    }
    #more-text b { font-weight: 500; color: #fff; }
  </style>
</head>
<body>
<div id="stage"
     data-composition-id="game-of-trivia-outro"
     data-start="0"
     data-duration="5"
     data-width="1920"
     data-height="1080">

  <div id="lockup">
    <div id="mark">
      <svg id="mark-border" viewBox="0 0 150 150" preserveAspectRatio="none">
        <rect x="3" y="3" width="144" height="144" pathLength="1000"/>
      </svg>
      <div id="mark-text">GOT</div>
    </div>
    <div id="thanks-wrap"><div id="thanks">Thank you for playing the quiz</div></div>
    <div id="more">
      <div class="rule"></div>
      <div id="more-text">More on <b>www.gameoftrivia.com</b></div>
      <div class="rule"></div>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(() => {
  const tl = gsap.timeline({ paused: true });
  const rect = document.querySelector('#mark-border rect');

  // Initial state (also what frame 0 shows)
  gsap.set('#mark', { opacity: 0, scale: 0.86 });
  gsap.set(rect, { attr: { 'stroke-dasharray': 1000, 'stroke-dashoffset': 1000 } });
  gsap.set('#mark-text', { opacity: 0 });
  gsap.set('#thanks', { yPercent: 110 });
  gsap.set('#more-text', { opacity: 0, y: 10 });
  gsap.set('#more .rule', { scaleX: 0 });

  // 0.1–0.8   mark appears, border draws, GOT fades in
  tl.to('#mark', { opacity: 1, scale: 1, duration: 0.55, ease: 'power3.out' }, 0.1);
  tl.to(rect, { attr: { 'stroke-dashoffset': 0 }, duration: 0.7, ease: 'power2.inOut' }, 0.2);
  tl.to('#mark-text', { opacity: 1, duration: 0.45, ease: 'power1.out' }, 0.45);
  // 0.7–1.4   "Thank you for playing the quiz" slides up out of its mask
  tl.to('#thanks', { yPercent: 0, duration: 0.7, ease: 'power4.out' }, 0.7);
  // 1.4–2.1   site line: rules grow, URL rises in
  tl.to('#more .rule', { scaleX: 1, duration: 0.55, ease: 'power2.out' }, 1.4);
  tl.to('#more-text', { opacity: 1, y: 0, duration: 0.55, ease: 'power2.out' }, 1.5);
  // slow settle while it holds
  tl.fromTo('#lockup', { scale: 1 }, { scale: 1.03, duration: 5, ease: 'none' }, 0);
  // 4.3–4.95  fade to the background colour
  tl.to('#lockup', { opacity: 0, duration: 0.65, ease: 'power1.in' }, 4.3);

  window.__timelines = window.__timelines || {};
  window.__timelines['game-of-trivia-outro'] = tl;
})();
</script>
</body>
</html>
