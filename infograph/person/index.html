<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Person Infograph</title>
  <style>
    @font-face { font-family: 'Fraunces';     font-weight: 300; font-style: normal; src: url('fonts/fraunces-300.woff2')     format('woff2'); }
    @font-face { font-family: 'Fraunces';     font-weight: 700; font-style: normal; src: url('fonts/fraunces-700.woff2')     format('woff2'); }
    @font-face { font-family: 'Space Grotesk'; font-weight: 500; font-style: normal; src: url('fonts/spacegrotesk-500.woff2') format('woff2'); }
    @font-face { font-family: 'Space Grotesk'; font-weight: 600; font-style: normal; src: url('fonts/spacegrotesk-600.woff2') format('woff2'); }
    @font-face { font-family: 'Space Grotesk'; font-weight: 700; font-style: normal; src: url('fonts/spacegrotesk-700.woff2') format('woff2'); }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #2F3E46; }

    /* ── Root stage ─────────────────────────────────────────────── */
    #stage {
      width: 1920px; height: 1080px;
      background: #2F3E46;
      position: relative;
      overflow: hidden;
    }

    /* ── Background ghost text ──────────────────────────────────── */
    #ghost-text {
      position: absolute;
      bottom: -120px; right: -30px;
      font-family: 'Fraunces', serif;
      font-size: 340px;
      font-weight: 900;
      color: rgba(167, 201, 87, 0.055);
      pointer-events: none;
      white-space: nowrap;
      z-index: 0;
      letter-spacing: -0.05em;
    }

    /* ── Background radial glow ─────────────────────────────────── */
    #bg-glow {
      position: absolute;
      right: 80px; bottom: 60px;
      width: 520px; height: 520px;
      background: radial-gradient(circle, rgba(88,129,87,0.16) 0%, rgba(88,129,87,0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Image panel (left 1060px) ──────────────────────────────── */
    #image-panel {
      position: absolute;
      left: 0; top: 0;
      width: 1060px; height: 1080px;
      overflow: hidden;
      z-index: 1;
    }

    .slide-wrap {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      opacity: 0;
    }

    .slide-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ── Vignette: right edge bleeds into data panel ────────────── */
    #img-vignette {
      position: absolute;
      left: 0; top: 0;
      width: 1060px; height: 1080px;
      background: linear-gradient(to right,
        rgba(47,62,70,0) 58%,
        rgba(47,62,70,0.88) 100%);
      z-index: 2;
      pointer-events: none;
      opacity: 0;
    }

    /* ── Vertical accent divider ────────────────────────────────── */
    #divider {
      position: absolute;
      left: 1064px; top: 0;
      width: 2px; height: 1080px;
      background: #A7C957;
      transform-origin: top center;
      transform: scaleY(0);
      opacity: 0;
      z-index: 3;
    }

    /* ── Top accent rule on data panel ─────────────────────────── */
    #panel-top-rule {
      position: absolute;
      left: 1082px; top: 0;
      width: 838px; height: 3px;
      background: linear-gradient(to right, #A7C957 0%, rgba(167,201,87,0.25) 55%, rgba(167,201,87,0) 100%);
      transform-origin: left;
      transform: scaleX(0);
      opacity: 0;
      z-index: 4;
    }

    /* ── Image caption ──────────────────────────────────────────── */
    #img-caption {
      position: absolute;
      bottom: 44px; left: 48px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      color: rgba(242, 232, 207, 0.42);
      letter-spacing: 0.1em;
      z-index: 5;
      opacity: 0;
    }

    /* ── Data panel ─────────────────────────────────────────────── */
    #data-panel {
      position: absolute;
      left: 1082px; top: 0;
      width: 838px; height: 1080px;
      padding: 68px 58px 56px 54px;
      display: flex;
      flex-direction: column;
      z-index: 5;
    }

    /* Type tag */
    #person-type {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      font-weight: 400;
      color: #A7C957;
      text-transform: uppercase;
      letter-spacing: 0.24em;
      margin-bottom: 10px;
      opacity: 0;
    }

    /* Person name */
    #person-name {
      font-family: 'Fraunces', serif;
      font-size: 90px;
      font-weight: 700;
      color: #F2E8CF;
      line-height: 0.92;
      letter-spacing: -0.03em;
      opacity: 0;
    }

    /* Horizontal rule */
    #rule {
      width: 100%; height: 2px;
      background: #52796F;
      margin: 22px 0 24px 0;
      transform-origin: left;
      transform: scaleX(0);
      flex-shrink: 0;
    }

    /* Origin row */
    #origin-row {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 22px;
      opacity: 0;
      flex-shrink: 0;
    }
    #origin-svg-el {
      width: 108px; height: 76px;
      flex-shrink: 0;
      overflow: visible;
    }
    #origin-svg-el path {
      fill: rgba(167, 201, 87, 0.14);
      stroke: #A7C957;
      stroke-width: 2.5;
      stroke-linejoin: round;
    }
    .meta-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      color: #A0C3AC;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      margin-bottom: 5px;
    }
    #origin-name-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 36px;
      font-weight: 600;
      color: #F2E8CF;
    }

    /* Data rows */
    .data-row {
      margin-bottom: 20px;
      opacity: 0;
      flex-shrink: 0;
    }
    .data-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      color: #A0C3AC;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      margin-bottom: 8px;
    }

    /* Lifespan */
    #lifespan-inner {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .span-year {
      font-family: 'Fraunces', serif;
      font-size: 54px;
      font-weight: 300;
      line-height: 1;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }
    #born-year  { color: #A7C957; }
    #died-year  { color: rgba(167, 201, 87, 0.72); }
    .year-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #A0C3AC;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      margin-top: 3px;
    }
    #lifespan-bar-wrap {
      flex: 1;
      height: 4px;
      background: rgba(82, 121, 111, 0.35);
      border-radius: 3px;
      overflow: hidden;
    }
    #lifespan-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, #A7C957, rgba(167,201,87,0.38));
      border-radius: 3px;
    }

    /* Role + Period */
    .data-value-compact {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 25px;
      font-weight: 500;
      color: #F2E8CF;
      line-height: 1.35;
    }
    #period-value { color: #DDA15E; }
  </style>
</head>
<body>

<div id="stage"
     data-composition-id="person-infograph"
     data-start="0"
     data-width="1920"
     data-height="1080"
     data-duration="24">

  <!-- Background decoratives -->
  <div id="bg-glow"></div>
  <div id="ghost-text" data-layout-allow-overflow aria-hidden="true">WWII</div>

  <!-- Left: image slideshow -->
  <div id="image-panel">
    <div class="slide-wrap" id="slide-1"><img id="img-1" data-layout-allow-overflow src="images/photo-1.jpg" /></div>
    <div class="slide-wrap" id="slide-2"><img id="img-2" data-layout-allow-overflow src="images/photo-2.jpg" /></div>
    <div class="slide-wrap" id="slide-3"><img id="img-3" data-layout-allow-overflow src="images/photo-3.jpg" /></div>
    <div class="slide-wrap" id="slide-4"><img id="img-4" data-layout-allow-overflow src="images/photo-4.jpg" /></div>
  </div>

  <!-- Vignette + structural elements -->
  <div id="img-vignette"></div>
  <div id="divider"></div>
  <div id="panel-top-rule"></div>
  <div id="img-caption">Adolf Hitler · 1889–1945</div>

  <!-- Right: data panel -->
  <div id="data-panel">

    <div id="person-type">Dictator · Nazi Germany</div>
    <div id="person-name">Adolf Hitler</div>

    <div id="rule"></div>

    <!-- Origin + D3 country silhouette -->
    <div id="origin-row">
      <svg id="origin-svg-el" viewBox="0 0 108 76"></svg>
      <div>
        <div class="meta-label">Origin</div>
        <div id="origin-name-text">Austria</div>
      </div>
    </div>

    <!-- Lifespan -->
    <div class="data-row" id="row-lifespan">
      <div class="data-label">Lifespan</div>
      <div id="lifespan-inner">
        <div>
          <div class="span-year" id="born-year">1889</div>
          <div class="year-sub">Born</div>
        </div>
        <div id="lifespan-bar-wrap"><div id="lifespan-bar"></div></div>
        <div style="text-align:right;">
          <div class="span-year" id="died-year">1945</div>
          <div class="year-sub" style="text-align:right;">Died</div>
        </div>
      </div>
    </div>

    <!-- Role -->
    <div class="data-row" id="row-role">
      <div class="data-label">Role</div>
      <div class="data-value-compact" id="role-value">Dictator of Nazi Germany</div>
    </div>

    <!-- Historical Period -->
    <div class="data-row" id="row-period">
      <div class="data-label">Historical Period</div>
      <div class="data-value-compact" id="period-value">World War II</div>
    </div>

  </div>
</div>

<!-- ── Dependencies ─────────────────────────────────────────────────── -->
<script src="https://d3js.org/d3.v7.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" crossorigin="anonymous"></script>

<script>
// ╔══════════════════════════════════════════════════════════════════════╗
// ║  PERSON DATA — edit this block to generate a card for any figure     ║
// ╚══════════════════════════════════════════════════════════════════════╝
const PERSON = {
  name:            "Adolf Hitler",
  typeTag:         "Dictator · Nazi Germany",
  born:            "1889",
  died:            "1945",
  origin:          "Austria",
  originCountryId: 40,      // ISO 3166-1 numeric (Austria=40, Germany=276, France=250…)
  role:            "Dictator of Nazi Germany",
  period:          "World War II",
  ghostText:       "WWII",
  caption:         "Adolf Hitler · 1889–1945",
  images: [
    "images/photo-1.jpg",
    "images/photo-2.jpg",
    "images/photo-3.jpg",
    "images/photo-4.jpg",
  ],
};

// ── Inject PERSON data into DOM ──────────────────────────────────────────
document.getElementById('person-type').textContent      = PERSON.typeTag;
document.getElementById('person-name').textContent      = PERSON.name;
document.getElementById('origin-name-text').textContent = PERSON.origin;
document.getElementById('born-year').textContent        = PERSON.born;
document.getElementById('died-year').textContent        = PERSON.died;
document.getElementById('role-value').textContent       = PERSON.role;
document.getElementById('period-value').textContent     = PERSON.period;
document.getElementById('ghost-text').textContent       = PERSON.ghostText;
document.getElementById('img-caption').textContent      = PERSON.caption;
PERSON.images.forEach((src, i) => {
  const el = document.getElementById('img-' + (i + 1));
  if (el && src) el.src = src;
});

(async () => {
  // ── Load world atlas + draw country outline ────────────────────────────
  let originPathEl = null;
  let pathTotalLen = 0;

  try {
    const world = await d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json');

    const feature = topojson.feature(world, {
      type: 'GeometryCollection',
      geometries: world.objects.countries.geometries.filter(d => +d.id === PERSON.originCountryId),
    });

    const proj    = d3.geoMercator().fitExtent([[4, 4], [104, 72]], feature);
    const pathGen = d3.geoPath().projection(proj);

    originPathEl = d3.select('#origin-svg-el')
      .append('path')
      .datum(feature)
      .attr('d', pathGen)
      .node();

    pathTotalLen = originPathEl.getTotalLength();
    originPathEl.style.strokeDasharray  = pathTotalLen;
    originPathEl.style.strokeDashoffset = pathTotalLen;

  } catch (e) {
    console.warn('Country outline unavailable:', e);
  }

  // ── Initial transform origins for varied Ken Burns directions ────────────
  gsap.set('#img-1', { transformOrigin: '50% 50%' });  // center zoom-in
  gsap.set('#img-2', { transformOrigin: '60% 30%' });  // upper focal, zoom-in
  gsap.set('#img-3', { transformOrigin: '35% 65%' });  // lower-left focal, zoom-in
  gsap.set('#img-4', { transformOrigin: '55% 40%' });  // center-right focal, zoom-in

  // ── GSAP timeline ────────────────────────────────────────────────────────
  const tl = gsap.timeline({ paused: true });

  const KB   = 1.08;  // Ken Burns target scale
  const XF   = 1.0;   // crossfade duration (seconds)
  const COMP = 24;    // total composition duration

  // ─ Slideshow: 4 images, each visible ~6 s with 1 s crossfade ────────────
  // Opacity on .slide-wrap; scale (Ken Burns) on <img> — separate elements,
  // no two-transform conflict.

  // Slide 1 — in at t=0.3, out at t=5.5
  tl.to('#slide-1', { opacity: 1, duration: 0.55, ease: 'power1.out'  }, 0.3);
  tl.to('#img-1',   { scale: KB,  duration: 6.2,  ease: 'none'        }, 0.3);
  tl.to('#slide-1', { opacity: 0, duration: XF,   ease: 'sine.inOut'  }, 5.5);

  // Slide 2 — in at t=5.5, out at t=11.5
  tl.to('#slide-2', { opacity: 1, duration: XF,   ease: 'sine.inOut'  }, 5.5);
  tl.to('#img-2',   { scale: KB,  duration: 7.0,  ease: 'none'        }, 5.5);
  tl.to('#slide-2', { opacity: 0, duration: XF,   ease: 'sine.inOut'  }, 11.5);

  // Slide 3 — in at t=11.5, out at t=17.5
  tl.to('#slide-3', { opacity: 1, duration: XF,   ease: 'sine.inOut'  }, 11.5);
  tl.to('#img-3',   { scale: KB,  duration: 7.0,  ease: 'none'        }, 11.5);
  tl.to('#slide-3', { opacity: 0, duration: XF,   ease: 'sine.inOut'  }, 17.5);

  // Slide 4 — in at t=17.5, holds through end
  tl.to('#slide-4', { opacity: 1, duration: XF,   ease: 'sine.inOut'  }, 17.5);
  tl.to('#img-4',   { scale: KB,  duration: 7.0,  ease: 'none'        }, 17.5);

  // ─ Panel structural entrances ─────────────────────────────────────────
  tl.to('#img-vignette',   { opacity: 1, duration: 0.8,  ease: 'power2.out'  }, 0.3);
  tl.to('#divider',        { scaleY: 1,  opacity: 1, duration: 0.9, ease: 'power3.out' }, 0.5);
  tl.to('#panel-top-rule', { scaleX: 1,  opacity: 1, duration: 0.75, ease: 'power2.out' }, 0.65);

  // ─ Data panel content stagger (all fromTo for determinism) ───────────
  tl.fromTo('#person-type',
    { opacity: 0, y: -14 },
    { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 0.9);

  tl.fromTo('#person-name',
    { opacity: 0, y: 36 },
    { opacity: 1, y: 0, duration: 0.75, ease: 'expo.out' }, 1.1);

  tl.to('#rule', { scaleX: 1, duration: 0.65, ease: 'power3.out' }, 1.65);

  tl.fromTo('#origin-row',
    { opacity: 0, x: 26 },
    { opacity: 1, x: 0, duration: 0.5, ease: 'power2.out' }, 2.0);

  if (originPathEl) {
    tl.fromTo(originPathEl,
      { strokeDashoffset: pathTotalLen },
      { strokeDashoffset: 0, duration: 1.5, ease: 'power2.inOut' }, 2.0);
  }

  tl.fromTo('#row-lifespan',
    { opacity: 0, x: 26 },
    { opacity: 1, x: 0, duration: 0.5, ease: 'power2.out' }, 2.3);

  tl.to('#lifespan-bar',
    { width: '100%', duration: 0.9, ease: 'power3.out' }, 2.75);

  tl.fromTo('#row-role',
    { opacity: 0, x: 26 },
    { opacity: 1, x: 0, duration: 0.5, ease: 'power2.out' }, 2.6);

  tl.fromTo('#row-period',
    { opacity: 0, x: 26 },
    { opacity: 1, x: 0, duration: 0.5, ease: 'power2.out' }, 2.9);

  tl.fromTo('#img-caption',
    { opacity: 0 },
    { opacity: 1, duration: 0.65, ease: 'power1.out' }, 3.6);

  // ─ Ambient motion (all on tl — never bare gsap.to) ──────────────────

  // Ghost text: slow upward drift over full composition
  tl.to('#ghost-text', { y: -70, duration: COMP, ease: 'none' }, 0);

  // BG glow: breathe — 5 plays × 2.8 s = 14 s from t=0
  tl.to('#bg-glow', { scale: 1.35, yoyo: true, repeat: 4, duration: 2.8, ease: 'sine.inOut' }, 0);

  // Born year: subtle scale breathe — 7 plays × 1.6 s = 11.2 s from t=4
  tl.to('#born-year', { scale: 1.04, yoyo: true, repeat: 6, duration: 1.6, ease: 'sine.inOut' }, 4.0);

  // Lifespan bar: opacity shimmer — 5 plays × 2.0 s = 10 s from t=4
  tl.to('#lifespan-bar', { opacity: 0.5, yoyo: true, repeat: 4, duration: 2.0, ease: 'sine.inOut' }, 4.0);

  // Divider: subtle opacity pulse — 5 plays × 2.2 s = 11 s from t=3
  tl.to('#divider', { opacity: 0.55, yoyo: true, repeat: 4, duration: 2.2, ease: 'sine.inOut' }, 3.0);

  // ─ Anchor at composition end ─────────────────────────────────────────
  tl.to({}, {}, COMP);

  window.__timelines = window.__timelines || {};
  window.__timelines['person-infograph'] = tl;
})();
</script>
</body>
</html>
